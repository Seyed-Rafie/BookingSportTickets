<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری | سامانه رزرو بلیط ورزشی</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- نویگیشن هدر -->
    <header class="header-nav">
        <div class="logo">🎟️ اسپورت‌تیکت | پنل کاربری</div>
        <nav>
            <a href="index.html">جستجوی مسابقات</a>
            <a href="#" id="logout-btn" style="color: var(--danger);">خروج از حساب</a>
        </nav>
    </header>

    <main class="container profile-container">
        
        <!-- سایدبار: فرم ویرایش اطلاعات کاربر -->
        <aside class="sidebar">
            <h2 style="margin-bottom: 1.5rem; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.5rem;">اطلاعات من</h2>
            <form id="profile-form">
                <div class="form-group">
                    <label for="user-name">نام و نام خانوادگی</label>
                    <input type="text" id="user-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="user-phone">شماره تماس (غیرقابل ویرایش)</label>
                    <input type="text" id="user-phone" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label for="user-email">ایمیل</label>
                    <input type="email" id="user-email" class="form-control" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="user-city">شهر سکونت</label>
                    <input type="text" id="user-city" class="form-control" placeholder="مثال: تهران">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">ثبت تغییرات</button>
                <div id="profile-msg" class="alert"></div>
            </form>
        </aside>

        <!-- بخش اصلی: تاریخچه خریدها و رزروها -->
        <section class="main-content">
            <h2 style="margin-bottom: 1.5rem;">تاریخچه بلیط‌ها و رزروهای من</h2>
            <div id="reservations-container">
                <p style="text-align: center; color: var(--text-muted); padding: 2rem;">در حال دریافت اطلاعات از سرور...</p>
            </div>
        </section>
    </main>

    <!-- مدال پیش‌نمایش جریمه و تایید کنسلی -->
    <div id="cancel-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color: var(--danger); margin-bottom: 1rem;">لغو و استرداد بلیط</h2>
            <div id="cancel-details" style="line-height: 1.8;">
                <!-- جزئیات جریمه از طریق JS لود می‌شود -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">انصراف</button>
                <button type="button" id="confirm-cancel-btn" class="btn btn-danger">تایید نهایی و لغو بلیط</button>
            </div>
        </div>
    </div>

    <!-- مدال ثبت گزارش مشکل -->
    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color: var(--warning); margin-bottom: 1rem;">ثبت گزارش مشکل</h2>
            <form id="report-form">
                <div class="form-group">
                    <label for="report-category">دسته‌بندی مشکل</label>
                    <select id="report-category" class="form-control" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="مشکل در پرداخت">مشکل در پرداخت</option>
                        <option value="مشکل در جایگاه">مشکل در جایگاه</option>
                        <option value="تغییر زمان مسابقه">تغییر زمان مسابقه</option>
                        <option value="سایر موارد">سایر موارد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="report-description">توضیحات تکمیلی</label>
                    <textarea id="report-description" class="form-control" rows="4" required placeholder="لطفاً مشکل خود را به صورت کامل شرح دهید..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal">انصراف</button>
                    <button type="submit" class="btn btn-warning">ارسال گزارش</button>
                </div>
            </form>
        </div>
    </div>

    <!-- اسکریپت کنترلر صفحه پروفایل -->
    <script type="module" src="js/profile.js"></script>
</body>
</html>
