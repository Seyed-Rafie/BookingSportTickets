<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام - سامانه بلیط‌فروشی</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>ورود یا ثبت‌نام</h2>
        
        <!-- مرحله ۱: دریافت شماره موبایل -->
        <form id="form-send-otp" class="auth-form">
            <div class="form-group">
                <label for="mobile">شماره موبایل:</label>
                <input type="tel" name="mobile" id="mobile" inputmode="numeric" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required dir="ltr">
            </div>
            <button type="submit" id="btn-send-otp">ارسال کد تایید</button>
        </form>

        <!-- مرحله ۲: ورود کد OTP (پنهان در ابتدا) -->
        <form id="form-verify-otp" class="auth-form hidden">
            <p class="info-text">کد تایید به شماره <strong id="display-mobile"></strong> ارسال شد.</p>
            <div class="form-group">
                <label for="otp-code">کد تایید را وارد کنید:</label>
                <input type="text" name="otp-code" id="otp-code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required dir="ltr">
            </div>
            <button type="submit" id="btn-verify-otp">تایید و ورود</button>
            <button type="button" id="btn-back" class="btn-link">تغییر شماره</button>
        </form>

        <div id="message-box" class="message-box hidden" aria-live="polite"></div>
    </div>

    <!-- کتابخانه‌های جاوااسکریپت -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
